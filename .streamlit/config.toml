[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f9"
textColor = "#111827"
font = "sans serif"

[client]
# "minimal" hides the options menu (including the Settings theme picker), so the app always stays light.
toolbarMode = "minimal"

[server]
# Re-run the app automatically when a source file is saved (handy for live changes).
runOnSave = true

[browser]
gatherUsageStats = false
